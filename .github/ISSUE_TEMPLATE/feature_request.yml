name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: |
        As a [user type], I want to [action] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: |
        I propose adding...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered
      placeholder: |
        - Alternative 1: ...
        - Alternative 2: ...

  - type: textarea
    id: api
    attributes:
      label: API Design (if applicable)
      description: Sketch of new endpoints, parameters, or SDK methods
      render: typescript
      placeholder: |
        // New endpoint
        POST /v1/new-endpoint
        {
          "field": "value"
        }

        // SDK method
        async function newMethod(params) { ... }

  - type: textarea
    id: security
    attributes:
      label: Security Considerations
      description: Any security implications? Threat model impact?
      placeholder: |
        This feature requires...
        - New permission: ...
        - Rate limit changes: ...
        - Audit logging: ...

  - type: textarea
    id: testing
    attributes:
      label: Testing Strategy
      description: How should this be tested?
      placeholder: |
        - Unit tests for...
        - Integration tests for...
        - Adversarial tests for...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (important)
        - High (blocking)
        - Critical (security/urgent)
      default: 1

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/features
          required: true
        - label: This aligns with AuthraGen's scope (vendor-neutral agent identity)
          required: true
        - label: I'm willing to contribute implementation
          required: false