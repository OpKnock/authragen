name: CI

on:
  push:
    branches: [master, main, production-hardening-v3, release/**]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -q ruff mypy
      - run: ruff check sdk_python/
      - run: mypy sdk_python/ --ignore-missing-imports

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
        env:
          AUTHRA_DATA: ${{ runner.temp }}/authragen-test

  test-python:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -q pytest httpx cryptography -e sdk_python/
      - run: python -m pytest sdk_python/ -v
        env:
          AUTHRA_DATA: ${{ runner.temp }}/authragen-test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities}, null, 2))"
      - name: Gate production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript,python
      - uses: github/codeql-action/analyze@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy.sarif'
      - name: Gitleaks current-tree scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:8.24.3 detect --source=/repo --redact --verbose --exit-code=1

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, test-python, security]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, test-python, security]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: authragen:test
          load: true
      - name: Smoke test container
        run: |
          docker run -d --name authragen-test -p 8787:8787 authragen:test
          sleep 5
          curl -f http://localhost:8787/v1/health
          docker logs authragen-test
          docker stop authragen-test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -q build twine cryptography -e sdk_python/
      - run: python -m build sdk_python/
      - run: twine upload sdk_python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64