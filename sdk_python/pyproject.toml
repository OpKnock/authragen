[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authragen"
version = "2.2.1"
description = "AuthraGen Python SDK — vendor-neutral agent identity and authorization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=41"]

[tool.setuptools]
py-modules = ["authragen"]
